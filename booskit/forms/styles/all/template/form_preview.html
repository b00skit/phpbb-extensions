<!-- INCLUDE overall_header.html -->

<h2 class="form-title">{L_PREVIEW}: {FORM_NAME}</h2>

<div class="panel">
	<div class="inner">
		<div class="content">
			<h3>{L_TOPIC_SUBJECT}: {PREVIEW_SUBJECT}</h3>
			<hr />
			<div class="postbody">
				<div class="content">
					{PREVIEW_BODY}
				</div>
			</div>
		</div>
	</div>
</div>

<form id="postform" method="post" action="{U_ACTION}">
	<div class="panel">
		<div class="inner">
			<fieldset class="submit-buttons">
				<!-- BEGIN hidden_fields -->
					<input type="hidden" name="{hidden_fields.NAME}" value="{hidden_fields.VALUE}" />
				<!-- END hidden_fields -->
				<input type="submit" name="back" value="{L_BACK}" class="button2" />
				<input type="submit" name="confirm" value="{L_CONFIRM}" class="button1" />
				{S_FORM_TOKEN}
			</fieldset>
		</div>
	</div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
	document.querySelectorAll('form').forEach(function(form) {
		form.addEventListener('submit', function(e) {
			if (e.defaultPrevented) return;
			if (form.dataset.submitting === 'true') {
				e.preventDefault();
				e.stopPropagation();
				return false;
			}
			form.dataset.submitting = 'true';
			setTimeout(function() {
				var submitBtns = form.querySelectorAll('input[type="submit"], button[type="submit"]');
				submitBtns.forEach(function(btn) {
					btn.disabled = true;
					btn.classList.add('disabled');
				});
			}, 0);
		});
	});
});
</script>

<!-- INCLUDE overall_footer.html -->
