{% if S_CAN_HIDE_TOPIC %}
	<li class="hidecontent-topic-option">
		{% if S_TOPIC_HIDDEN %}
			<a href="{{ U_UNHIDE_TOPIC }}" title="{{ lang('UNHIDE_TOPIC') }}" role="menuitem">
				<i class="icon fa-eye fa-fw" aria-hidden="true"></i><span>{{ lang('UNHIDE_TOPIC') }}</span>
			</a>
		{% else %}
			<a href="{{ U_HIDE_TOPIC }}" title="{{ lang('HIDE_TOPIC') }}" role="menuitem">
				<i class="icon fa-eye-slash fa-fw" aria-hidden="true"></i><span>{{ lang('HIDE_TOPIC') }}</span>
			</a>
		{% endif %}
	</li>
{% endif %}
