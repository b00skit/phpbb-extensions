{% if postrow.S_CAN_HIDE_POST %}
<li>
	{% if postrow.S_POST_HIDDEN_CUSTOM %}
	<a href="{{ postrow.U_UNHIDE_POST }}" title="{{ lang('UNHIDE_POST') }}" class="button button-icon-only button-hide">
		<i class="icon fa-eye fa-fw" aria-hidden="true"></i><span class="sr-only">{{ lang('UNHIDE_POST') }}</span>
	</a>
	{% else %}
	<a href="{{ postrow.U_HIDE_POST }}" title="{{ lang('HIDE_POST') }}" class="button button-icon-only button-hide">
		<i class="icon fa-eye-slash fa-fw" aria-hidden="true"></i><span class="sr-only">{{ lang('HIDE_POST') }}</span>
	</a>
	{% endif %}
</li>
{% endif %}
