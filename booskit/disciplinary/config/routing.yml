booskit_disciplinary_add_record:
    path: /disciplinary/add/{user_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:add_record' }
    requirements:
        user_id: \d+

booskit_disciplinary_edit_record:
    path: /disciplinary/edit/{record_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:edit_record' }
    requirements:
        record_id: \d+

booskit_disciplinary_delete_record:
    path: /disciplinary/delete/{record_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:delete_record' }
    requirements:
        record_id: \d+

booskit_disciplinary_archive_record:
    path: /disciplinary/archive/{record_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:archive_record' }
    requirements:
        record_id: \d+

booskit_disciplinary_unarchive_record:
    path: /disciplinary/unarchive/{record_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:unarchive_record' }
    requirements:
        record_id: \d+

booskit_disciplinary_view_all:
    path: /disciplinary/view/{user_id}
    defaults: { _controller: 'booskit.disciplinary.controller.main:view_all' }
    requirements:
        user_id: \d+
