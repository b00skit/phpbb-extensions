<!-- INCLUDE overall_header.html -->

<h2 class="titlespace">{L_ADD_CHARACTER}</h2>

<form id="add_ic_character" method="post" action="{U_ACTION}">

<div class="panel">
	<div class="inner">
		<fieldset>
			<dl>
				<dt><label for="character_name">{L_CHARACTER_NAME}:</label></dt>
				<dd><input type="text" name="character_name" id="character_name" value="" class="inputbox autowidth" /></dd>
			</dl>
		</fieldset>
	</div>
</div>

<div class="submit-buttons">
	<input type="reset" value="{L_RESET}" name="reset" class="button2" />&nbsp;
	<input type="submit" name="submit" value="{L_SUBMIT}" class="button1" />
	{S_FORM_TOKEN}
</div>

</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
	document.querySelectorAll('form').forEach(function(form) {
		form.addEventListener('submit', function(e) {
			if (e.defaultPrevented) return;
			if (form.dataset.submitting === 'true') {
				e.preventDefault();
				e.stopPropagation();
				return false;
			}
			form.dataset.submitting = 'true';
			setTimeout(function() {
				var submitBtns = form.querySelectorAll('input[type="submit"], button[type="submit"]');
				submitBtns.forEach(function(btn) {
					btn.disabled = true;
					btn.classList.add('disabled');
				});
			}, 0);
		});
	});
});
</script>

<div class="panel">
	<div class="inner">
		<ul class="linklist">
			<li>
				<a href="{U_BACK}">&lt; {L_BACK_TO_PROFILE}</a>
			</li>
		</ul>
	</div>
</div>

<!-- INCLUDE overall_footer.html -->
