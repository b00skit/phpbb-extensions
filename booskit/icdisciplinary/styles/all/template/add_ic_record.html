<!-- INCLUDE overall_header.html -->

<h2 class="solo"><!-- IF S_EDIT -->{L_EDIT_IC_RECORD}<!-- ELSE -->{L_ADD_IC_RECORD}<!-- ENDIF --> - {CHARACTER_NAME}</h2>

<script>
	var form_name = 'add_ic_record';
	var text_name = 'reason'; // Default to reason

	function set_text_name(name) {
		text_name = name;
	}
</script>

<form id="add_ic_record" method="post" action="{U_ACTION}">
    {% if BOOSKIT_ICDISCIPLINARY_RULESET %}
    <div class="rules">
        <div class="inner">
            <div class="content">{{ BOOSKIT_ICDISCIPLINARY_RULESET|raw }}</div>
        </div>
    </div>
    {% endif %}

	<div class="panel">
		<div class="inner">
			<fieldset>
				<dl>
					<dt><label for="disciplinary_type_id">{L_DISCIPLINARY_TYPE}:</label></dt>
					<dd>
						<select name="disciplinary_type_id" id="disciplinary_type_id">
							<option value="">{L_SELECT_DISCIPLINARY_TYPE}</option>
							<!-- BEGIN types -->
							<option value="{types.ID}" data-can-notes="{types.CAN_ISSUE_PRIVATE_NOTES}"<!-- IF types.SELECTED --> selected="selected"<!-- ENDIF -->>{types.NAME}</option>
							<!-- END types -->
						</select>
					</dd>
				</dl>
				<dl>
					<dt><label for="issue_date">{L_ISSUE_DATE}:</label></dt>
					<dd><input type="date" name="issue_date" id="issue_date" value="{S_ISSUE_DATE}" class="inputbox autowidth" /></dd>
				</dl>

				<dl>
					<dt><label for="reason">{L_REASON}:</label></dt>
					<dd><textarea name="reason" id="reason" rows="10" cols="30" class="inputbox" onfocus="set_text_name('reason');" tabindex="3">{REASON}</textarea></dd>
				</dl>
				<dl id="private_notes_dl" style="display: none;">
					<dt><label for="evidence">{L_PRIVATE_NOTES}:</label></dt>
					<dd><textarea name="evidence" id="evidence" rows="10" cols="30" class="inputbox" onfocus="set_text_name('evidence');" tabindex="4">{EVIDENCE}</textarea></dd>
				</dl>
			</fieldset>
		</div>
	</div>

	<fieldset class="submit-buttons">
		<input type="submit" accesskey="s" tabindex="6" name="submit" value="{L_SUBMIT}" class="button1" />&nbsp;
		<a href="{U_BACK}" class="button2">{L_CANCEL}</a>
		{S_FORM_TOKEN}
	</fieldset>
</form>

<script>
(function() {
	var typesData = {};
	try {
		typesData = {{ TYPES_JSON|raw }};
	} catch (e) {}

	function updatePrivateNotesVisibility() {
		var select = document.getElementById('disciplinary_type_id');
		var container = document.getElementById('private_notes_dl');
		if (!select || !container) return;

		var selectedId = select.value;
		var canNotes = false;

		if (selectedId && typesData && typesData[selectedId]) {
			canNotes = typesData[selectedId].can_issue_private_notes;
		} else {
			var opt = select.options[select.selectedIndex];
			if (opt) {
				var attr = opt.getAttribute('data-can-notes');
				if (attr === '1' || attr === 1 || attr === 'true') {
					canNotes = true;
				}
			}
		}

		if (canNotes) {
			container.style.display = 'block';
		} else {
			container.style.display = 'none';
		}
	}

	function init() {
		if (typeof jQuery !== 'undefined') {
			jQuery('#disciplinary_type_id').on('change', updatePrivateNotesVisibility);
		}
		var select = document.getElementById('disciplinary_type_id');
		if (select) {
			select.addEventListener('change', updatePrivateNotesVisibility);
		}
		updatePrivateNotesVisibility();

		document.querySelectorAll('form').forEach(function(form) {
			form.addEventListener('submit', function(e) {
				if (e.defaultPrevented) return;
				if (form.dataset.submitting === 'true') {
					e.preventDefault();
					e.stopPropagation();
					return false;
				}
				form.dataset.submitting = 'true';
				setTimeout(function() {
					var submitBtns = form.querySelectorAll('input[type="submit"], button[type="submit"]');
					submitBtns.forEach(function(btn) {
						btn.disabled = true;
						btn.classList.add('disabled');
					});
				}, 0);
			});
		});
	}

	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init);
	} else {
		init();
	}
})();
</script>

<!-- INCLUDE overall_footer.html -->
